[project]
name = "translatorai"
version = "0.1.0"
description = "Proyecto de traductor AI usando python y modelo de lenguaje por OpenRouter"
authors = [
    {name = "Oliver Consterla",email = "oliver_consterla@yahoo.cl"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "whisper",
    "pyaudio",
    "numpy",
    "soundfile",
    "transformers",
    "torch"
]

[tool.poetry]
packages = [{include = "translatorai", from = "src"}]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
